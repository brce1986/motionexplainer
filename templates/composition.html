<!doctype html>
<!--
  Site-explainer base composition (HyperFrames + GSAP). 16:9 by default; for 9:16 set the sizes on <html>/#root,
  the viewport meta, and move the world centre (#space perspective-origin, #world top) to the middle of the stage.
  Replace every BRAND_* token, the fonts, the scenes and the LOGO slot (scripts/logo_split.py).
  Times in the timeline are timeline seconds = VO time + vo_offset (cues.json).
-->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Client explainer</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* the client's own webfont (self-hosted), every weight you use */
      @font-face { font-family: "Brand"; font-weight: 400; font-display: block; src: url("assets/fonts/Brand-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Brand"; font-weight: 700; font-display: block; src: url("assets/fonts/Brand-Bold.woff2") format("woff2"); }
      :root {
        --ink: #020817; --ink2: #0d1220; --ink3: #1b2438;                 /* BRAND_BACKGROUNDS */
        --text: #f4f7f1; --mute: rgba(244, 247, 241, 0.62); --faint: rgba(244, 247, 241, 0.42);
        --a: #2dc8c4; --b: #fecb53;                                       /* BRAND_COLOR_A (meaning), BRAND_COLOR_B (meaning) */
        --beam: linear-gradient(90deg, #2dc8c4 0%, #fecb53 100%);        /* BRAND_GRADIENT: highlights */
        --line: rgba(255, 255, 255, 0.1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Brand", sans-serif; color: var(--text); background: var(--ink); }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; left: 0; top: 0; }
      .g { background: var(--beam); -webkit-background-clip: text; background-clip: text; color: transparent; }

      /* living background: drift moves the glow, scene changes move its wrapper (never both on one element) */
      #bg { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, var(--ink2) 0%, var(--ink) 70%); }
      #bgPar { position: absolute; left: -240px; top: -200px; width: 2400px; height: 1480px; }
      .glow { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(110px); }
      #gA { width: 1100px; height: 1100px; background: radial-gradient(circle closest-side, rgba(45, 200, 196, 0.5), rgba(45, 200, 196, 0) 75%); }
      #gB { width: 1000px; height: 1000px; background: radial-gradient(circle closest-side, rgba(254, 203, 83, 0.32), rgba(254, 203, 83, 0) 75%); }
      #beamLine { position: absolute; left: 0; top: 0; width: 1600px; height: 2px; background: linear-gradient(90deg, transparent, rgba(45, 200, 196, 0.5) 28%, rgba(254, 203, 83, 0.5) 72%, transparent); }

      /* camera */
      #space { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 960px 640px; }
      #world { position: absolute; left: 960px; top: 640px; width: 0; height: 0; transform-style: preserve-3d; }
      .sub { position: absolute; left: 0; top: 0; }

      /* title band: same place, same size, every beat */
      #band { position: absolute; left: 0; right: 0; top: 0; height: 230px; }
      #mask { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; overflow: hidden; }
      #mask .word { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 88px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }

      /* hook lines, flat on the screen */
      .hk { position: absolute; left: 0; right: 0; top: 480px; text-align: center; font-size: 92px; font-weight: 700; letter-spacing: -0.035em; white-space: nowrap; line-height: 1.1; }

      /* liquid glass (dark). Light theme: rgba(255,255,255,.6) + white border */
      .glass { background: linear-gradient(180deg, rgba(27, 36, 56, 0.66) 0%, rgba(13, 18, 32, 0.56) 100%); backdrop-filter: blur(26px) saturate(160%); -webkit-backdrop-filter: blur(26px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.11); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 40px 90px rgba(0, 0, 0, 0.45); }
      .card { border-radius: 26px; }
      .lbl { font-size: 15px; color: var(--faint); letter-spacing: 0.06em; text-transform: uppercase; }
      .pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 99px; font-size: 15px; font-weight: 700; white-space: nowrap; background: rgba(45, 200, 196, 0.16); color: var(--a); }
      .row { display: flex; justify-content: space-between; margin-top: 12px; padding: 12px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); font-size: 18px; color: var(--mute); }
      .row em { font-style: normal; font-weight: 700; color: var(--text); }

      /* demo cards: replace with the client's real UI rebuilt in HTML */
      #cardA { width: 420px; padding: 26px; }
      #cardA b { display: block; font-size: 26px; font-weight: 700; margin: 10px 0 6px; }
      #cardB { width: 520px; padding: 30px; }
      #cardB h3 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-top: 8px; }
      #cardB strong { display: block; font-size: 54px; font-weight: 700; letter-spacing: -0.03em; margin-top: 14px; }
      #counter { font-variant-numeric: tabular-nums; }

      /* lockup */
      #lockup { width: 1200px; display: flex; flex-direction: column; align-items: center; }
      #lgTop { display: flex; flex-direction: column; align-items: center; }
      #logoSvg { width: 900px; height: auto; overflow: visible; }
      #logoText { font-size: 120px; font-weight: 700; letter-spacing: -0.04em; }
      #tag { margin-top: 46px; font-size: 54px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; }
      #cta { display: flex; gap: 18px; margin-top: 40px; }
      .btn { height: 60px; padding: 0 28px; border-radius: 16px; display: flex; align-items: center; font-size: 20px; font-weight: 700; color: var(--ink2); background: var(--beam); }
      #url { font-size: 22px; color: var(--mute); margin-top: 26px; letter-spacing: 0.04em; }
    </style>
    <!-- the video's design system (G2b): loaded after the defaults above, so its tokens win -->
    <link rel="stylesheet" href="tokens.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <!-- the mix from scripts/soundtrack.py -->
      <audio id="mix" src="assets/audio/mix.mp3" data-start="0" data-duration="20" data-track-index="9" data-volume="1"></audio>

      <section id="scene" class="clip" data-start="0" data-duration="20" data-track-index="0">
        <div id="bg">
          <div id="bgPar">
            <div id="gAw" class="abs"><div id="gA" class="glow"></div></div>
            <div id="gBw" class="abs"><div id="gB" class="glow"></div></div>
            <div id="beamLine"></div>
            <!-- optional: the client's photos, small and blurred, drifting at the edges (data-layout-ignore) -->
          </div>
        </div>

        <div id="space">
          <div id="world">
            <div id="cardA" class="sub card glass"><span class="lbl">Demo</span><b>A card that flies</b><span class="pill">Verified</span>
              <div class="row"><span>Price</span><em>$28</em></div><div class="row"><span>Rating</span><em>4.9</em></div></div>
            <div id="cardB" class="sub card glass"><span class="lbl">Morph target</span><h3>It becomes this card</h3><strong id="counter" class="g">$0.00</strong></div>

            <div id="lockup" class="sub">
              <div id="lgTop">
                <!--LOGO: paste the output of scripts/logo_split.py here and delete #logoText -->
                <div id="logoText" class="lg lg-a">Client<span class="g">Logo</span></div>
                <div id="tag">The tagline, with <span class="g">the highlight.</span></div>
              </div>
              <div id="cta"><span class="btn">Primary call to action</span></div>
              <div id="url">www.client.com</div>
            </div>
          </div>
        </div>

        <div id="hook" class="clip">
          <div class="hk" id="hk1">The everyday problem, line one.</div>
          <div class="hk" id="hk2">Line two, <span class="g">the sting.</span></div>
        </div>

        <div id="band">
          <div id="mask">
            <div class="word" id="t0">First <span class="g">verb.</span></div>
            <div class="word" id="t1">Second <span class="g">verb.</span></div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const T = 20;

      // ---- text driven by time (typing, counters): computed from t, so every seek / render frame is right ----
      const easeOut = gsap.parseEase("power2.out");
      const ramp = (t, a, d) => easeOut(Math.min(1, Math.max(0, (t - a) / d)));
      function texts(t) {
        $("#counter").textContent = "$" + (1240 * ramp(t, 8.6, 0.9)).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }

      // ---- helpers (the house style) ----
      function rel(el, sub) {          // centre of el relative to the centre of sub, in world units (measure before tweens)
        const a = el.getBoundingClientRect(), b = sub.getBoundingClientRect();
        return { x: a.left + a.width / 2 - (b.left + b.width / 2), y: a.top + a.height / 2 - (b.top + b.height / 2), w: a.width, h: a.height };
      }
      const P = (x, y, z = 0, ry = 0, s = 1, rx = 0) => ({ xPercent: -50, yPercent: -50, x, y, z, rotationY: ry, rotationX: rx, scale: s });
      const PS = (x, y, z, sx, sy) => ({ xPercent: -50, yPercent: -50, x, y, z, rotationY: 0, rotationX: 0, scaleX: sx, scaleY: sy });
      // a flight: one element, one path; motion blur = a blur peaking mid-move (never lagged clones). mb 0 for phones/photos
      function fly(tl, sel, from, to, t, dur, ease = "power3.inOut", mb = 4) {
        tl.fromTo(sel, from, { ...to, duration: dur, ease, immediateRender: false }, t);
        if (!mb) return;
        tl.to(sel, { filter: `blur(${mb}px) brightness(1)`, duration: dur * 0.4, ease: "sine.in" }, t + dur * 0.05);
        tl.to(sel, { filter: "blur(0px) brightness(1)", duration: dur * 0.45, ease: "sine.out" }, t + dur * 0.5);
      }
      // morph: A's content out -> B (empty) set exactly on A's box, A hidden in the same frame -> B grows -> B's content in
      function morph(tl, A, B, at, to, t, dur = 0.6) {
        const a = $(A), b = $(B), box = PS(at.x, at.y, at.z, a.offsetWidth / b.offsetWidth, a.offsetHeight / b.offsetHeight);
        tl.to(`${A} > *`, { opacity: 0, duration: 0.2 }, t - 0.2);
        tl.set(`${B} > *`, { opacity: 0 }, t - 0.05);
        tl.set(B, { ...box, opacity: 1 }, t);
        tl.set(A, { opacity: 0 }, t);
        fly(tl, B, box, PS(to.x, to.y, to.z, 1, 1), t, dur, "power3.inOut", 0);
        tl.to(`${B} > *`, { opacity: 1, duration: 0.35, stagger: 0.03 }, t + dur * 0.4);
      }
      const focus = (tl, sel, blur, bright, t, d = 0.45) => tl.to(sel, { filter: `blur(${blur}px) brightness(${bright})`, duration: d, ease: "power2.inOut" }, t);
      const show = (tl, sel, t, y = 24, d = 0.5) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "expo.out", immediateRender: false }, t);
      function rise(tl, sel, t, y = 50, d = 0.6) {   // type that "focuses" in
        tl.fromTo(sel, { opacity: 0, y, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "expo.out", immediateRender: false }, t);
      }
      // camera: the world turns and dollies; the background slides the other way (parallax)
      function cam(tl, t, d, ry, rx, z, y = 0, ease = "sine.inOut") {
        tl.to("#world", { rotationY: ry, rotationX: rx, z, y, duration: d, ease }, t);
        tl.to("#bgPar", { x: -ry * 10, y: rx * 8 - y * 0.15, duration: d, ease }, t);
      }
      const W = ["#t0", "#t1"];
      const WT = [3.8, 8.2, 12.0];       // each verb's VO time + offset; the last entry is when the band clears

      function build() {
        const tl = gsap.timeline({ paused: true });
        // everything that enters later is hidden at t=0 (otherwise it flashes for a frame)
        tl.set(["#cardA", "#cardB", "#lockup"], { xPercent: -50, yPercent: -50, opacity: 0, filter: "blur(0px) brightness(1)" }, 0);
        tl.set("#world", { rotationY: 8, rotationX: 4, z: -200 }, 0);
        tl.set(W, { yPercent: 110, opacity: 0 }, 0);
        tl.set([".hk", "#tag", "#cta", "#url", ".lg"], { opacity: 0 }, 0);

        // ---- background: loops cover the whole film; the beam restarts off-frame ----
        tl.fromTo("#gA", { x: 100, y: 500 }, { x: 700, y: 120, duration: 10, ease: "sine.inOut", repeat: Math.ceil(T / 10), yoyo: true }, 0);
        tl.fromTo("#gB", { x: 1500, y: 0 }, { x: 1000, y: 500, duration: 8, ease: "sine.inOut", repeat: Math.ceil(T / 8), yoyo: true }, 0);
        tl.fromTo("#beamLine", { x: -1900, y: 1040, opacity: 0.6 }, { x: 2600, y: 1040, duration: 14, ease: "none", repeat: Math.ceil(T / 14) }, 0);

        // ---- title band ----
        W.forEach((w, i) => {
          tl.fromTo(w, { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, WT[i]);
          tl.to(w, { yPercent: -110, opacity: 0, duration: 0.35, ease: "power3.in" }, WT[i + 1] - 0.3);
        });

        // ---- hook: one line at a time, earlier lines step up and dim ----
        const HK = [["#hk1", 0.4], ["#hk2", 1.8]];
        HK.forEach(([q, t], i) => {
          rise(tl, q, t);
          HK.slice(0, i).forEach(([p], j) => tl.to(p, { y: -(i - j) * 130, opacity: 0.22, duration: 0.5, ease: "power3.out" }, t));
        });
        tl.to(".hk", { opacity: 0, filter: "blur(14px)", duration: 0.4, ease: "power2.in" }, 3.3);

        // ---- a card arrives from depth, the camera drifts ----
        cam(tl, 3.4, 0.9, -8, 4, 40, 0, "power3.inOut");
        fly(tl, "#cardA", { ...P(140, 220, -900, -12, 1), opacity: 0 }, { ...P(0, 0, 0, 0, 1), opacity: 1 }, 3.8, 0.9, "expo.out", 4);
        cam(tl, 4.3, 3.6, -3, 3, 120);

        // ---- the card morphs into another ----
        morph(tl, "#cardA", "#cardB", { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 80 }, 8.2, 0.6);
        cam(tl, 8.1, 3.4, 5, 3, 200);

        // ---- lockup: the logo arrives centred, then lifts and shrinks a little for the CTA + URL ----
        tl.to("#cardB", { z: -900, opacity: 0, filter: "blur(10px) brightness(1)", duration: 0.5, ease: "power2.in" }, 11.6);
        tl.to("#gAw", { x: 360, y: 120, duration: 1.4, ease: "power3.inOut" }, 11.4);    // the brand colours converge behind the logo
        tl.to("#gBw", { x: -360, y: 120, duration: 1.4, ease: "power3.inOut" }, 11.4);
        const lgShift = ($("#lockup").offsetHeight - $("#lgTop").offsetHeight) / 2;
        tl.set("#lockup", { ...P(0, -90, 0), opacity: 1 }, 12.0);
        tl.set("#lgTop", { y: lgShift, scale: 1 }, 12.0);
        // with the real logo: spin the mark (#lg-mark, svgOrigin = its centre) and raise .lg-a/.lg-b/... in groups
        tl.fromTo(".lg", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.05, immediateRender: false }, 12.1);
        show(tl, "#tag", 13.2, 30, 0.7);
        tl.to("#lgTop", { y: 0, scale: 0.9, transformOrigin: "50% 100%", duration: 0.8, ease: "power3.inOut" }, 15.0);
        show(tl, "#cta", 15.45, 24, 0.6);
        show(tl, "#url", 15.85, 16, 0.6);
        cam(tl, 11.8, T - 11.8, 0, 0, 120, 0, "sine.out");

        tl.eventCallback("onUpdate", () => texts(tl.time()));
        return tl;
      }
      window.addEventListener("hf-seek", (e) => texts(e.detail.time));
      const imgs = Array.from(document.images).map((i) => (i.complete ? Promise.resolve() : new Promise((r) => { i.onload = r; i.onerror = r; })));
      Promise.all([document.fonts.load("700 88px Brand"), document.fonts.load("400 20px Brand"), ...imgs]).then(() => {
        texts(0);
        window.__timelines["main"] = build();
      });
    </script>
  </body>
</html>
